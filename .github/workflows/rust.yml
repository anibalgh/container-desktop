name: Rust

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
    types: ["opened", "synchronize", "reopened", "closed"]

env:
  CARGO_TERM_COLOR: always
  NODE_VERSION: "24"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  validate:
    name: Validate (${{ matrix.label }})
    if: github.event_name == 'push' || github.event.action != 'closed' || (github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.ref == 'dev')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: Linux
            install_linux_deps: true
          - os: macos-latest
            label: macOS
            install_linux_deps: false
          - os: windows-latest
            label: Windows
            install_linux_deps: false

    steps:
      - uses: actions/checkout@v5
        if: github.event_name != 'pull_request' || github.event.action != 'closed'
      - uses: actions/checkout@v5
        if: github.event_name == 'pull_request' && github.event.action == 'closed'
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Validate project context bootstrap
        shell: bash
        run: ./scripts/load-project-context.sh --check
      - name: Install Linux system dependencies
        if: matrix.install_linux_deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libglib2.0-dev \
            libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Build
        run: cargo build --verbose
      - name: Run tests
        run: cargo test --verbose
      - name: Build frontend
        run: npm run build --prefix frontend

  prepare_release:
    if: (github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.ref == 'dev') || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      eligible: ${{ steps.eligibility.outputs.eligible }}
      target_commitish: ${{ steps.eligibility.outputs.target_commitish }}
      version: ${{ steps.release_meta.outputs.version }}
      short_sha: ${{ steps.release_meta.outputs.short_sha }}
      tag: ${{ steps.release_meta.outputs.tag }}
      title: ${{ steps.release_meta.outputs.title }}

    steps:
      - uses: actions/checkout@v5
        if: github.event_name != 'pull_request' || github.event.action != 'closed'
        with:
          fetch-depth: 0
      - uses: actions/checkout@v5
        if: github.event_name == 'pull_request' && github.event.action == 'closed'
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
      - name: Determine release eligibility
        id: eligibility
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "eligible=true" >> "$GITHUB_OUTPUT"
            echo "target_commitish=${{ github.event.pull_request.merge_commit_sha }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git fetch --no-tags origin dev:refs/remotes/origin/dev
          if [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/dev)" ]; then
            echo "eligible=true" >> "$GITHUB_OUTPUT"
            echo "target_commitish=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          else
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            echo "target_commitish=" >> "$GITHUB_OUTPUT"
          fi
      - name: Prepare release metadata
        if: steps.eligibility.outputs.eligible == 'true'
        id: release_meta
        run: |
          version=$(python3 - <<'PY'
          import json
          from pathlib import Path

          print(json.loads(Path("src-tauri/tauri.conf.json").read_text())["version"])
          PY
          )
          short_sha=$(git rev-parse --short HEAD)
          tag="v${version}-${short_sha}"
          title="Container Desktop v${version} (${short_sha})"
          {
            echo "version=$version"
            echo "short_sha=$short_sha"
            echo "tag=$tag"
            echo "title=$title"
          } >> "$GITHUB_OUTPUT"

  release-linux-bundles:
    if: needs.prepare_release.outputs.eligible == 'true'
    needs: prepare_release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare_release.outputs.target_commitish }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Validate project context bootstrap
        shell: bash
        run: ./scripts/load-project-context.sh --check
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libglib2.0-dev \
            libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Install Tauri CLI
        run: cargo install tauri-cli --locked
      - name: Build Linux bundles
        run: cargo tauri build --bundles deb,rpm,appimage
      - name: Stage Linux release assets
        run: |
          mkdir -p release-assets/linux
          cp target/release/bundle/deb/*.deb release-assets/linux/
          cp target/release/bundle/rpm/*.rpm release-assets/linux/
          cp target/release/bundle/appimage/*.AppImage release-assets/linux/
      - name: Upload Linux release assets
        uses: actions/upload-artifact@v7
        with:
          name: release-linux-bundles
          if-no-files-found: error
          path: release-assets/linux/*

  release-macos-bundles:
    if: needs.prepare_release.outputs.eligible == 'true'
    needs: prepare_release
    name: release-macos-bundles (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            label: Intel
            target: x86_64-apple-darwin
            artifact_name: release-macos-bundles-x86_64
          - os: macos-14
            label: Apple-Silicon
            target: aarch64-apple-darwin
            artifact_name: release-macos-bundles-aarch64

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare_release.outputs.target_commitish }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Validate project context bootstrap
        shell: bash
        run: ./scripts/load-project-context.sh --check
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Install Tauri CLI
        run: cargo install tauri-cli --locked
      - name: Build macOS bundles
        run: cargo tauri build --target ${{ matrix.target }} --bundles dmg
      - name: Stage macOS release assets
        run: |
          mkdir -p release-assets/macos
          cp target/${{ matrix.target }}/release/bundle/dmg/*.dmg release-assets/macos/
      - name: Upload macOS release assets
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          if-no-files-found: error
          path: release-assets/macos/*

  release-windows-bundles:
    if: needs.prepare_release.outputs.eligible == 'true'
    needs: prepare_release
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare_release.outputs.target_commitish }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Windows bundle dependencies
        run: choco install nsis wixtoolset -y
      - name: Validate project context bootstrap
        shell: bash
        run: ./scripts/load-project-context.sh --check
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Install Tauri CLI
        run: cargo install tauri-cli --locked
      - name: Build Windows bundles
        run: cargo tauri build --target x86_64-pc-windows-msvc --bundles msi,nsis
      - name: Stage Windows release assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-assets/windows | Out-Null
          Copy-Item -Path 'target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi' -Destination 'release-assets/windows/'
          Copy-Item -Path 'target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe' -Destination 'release-assets/windows/'
      - name: Upload Windows release assets
        uses: actions/upload-artifact@v7
        with:
          name: release-windows-bundles-x86_64
          if-no-files-found: error
          path: release-assets/windows/*

  publish-release:
    if: needs.prepare_release.outputs.eligible == 'true'
    needs:
      - prepare_release
      - release-linux-bundles
      - release-macos-bundles
      - release-windows-bundles
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Linux release assets
        uses: actions/download-artifact@v4
        with:
          name: release-linux-bundles
          path: release-artifacts/linux
      - name: Download macOS Intel release assets
        uses: actions/download-artifact@v4
        with:
          name: release-macos-bundles-x86_64
          path: release-artifacts/macos-intel
      - name: Download macOS Apple Silicon release assets
        uses: actions/download-artifact@v4
        with:
          name: release-macos-bundles-aarch64
          path: release-artifacts/macos-arm
      - name: Download Windows release assets
        uses: actions/download-artifact@v4
        with:
          name: release-windows-bundles-x86_64
          path: release-artifacts/windows
      - name: Generate SHA512 checksums
        run: |
          cd release-artifacts
          find linux macos-intel macos-arm windows -type f -print0 | sort -z | xargs -0 sha512sum > SHA512SUMS
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare_release.outputs.tag }}
          name: ${{ needs.prepare_release.outputs.title }}
          target_commitish: ${{ needs.prepare_release.outputs.target_commitish }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-artifacts/linux/*.deb
            release-artifacts/linux/*.rpm
            release-artifacts/linux/*.AppImage
            release-artifacts/macos-intel/*.dmg
            release-artifacts/macos-arm/*.dmg
            release-artifacts/windows/*.msi
            release-artifacts/windows/*.exe
            release-artifacts/SHA512SUMS
