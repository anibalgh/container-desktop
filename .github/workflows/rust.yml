name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
    types: [ "opened", "synchronize", "reopened" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
    - uses: dtolnay/rust-toolchain@stable
    - uses: actions/setup-node@v5
      with:
        node-version-file: frontend/package.json
        cache: npm
        cache-dependency-path: frontend/package-lock.json
    - name: Validate project context bootstrap
      run: ./scripts/load-project-context.sh --check
    - name: Install Linux system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          pkg-config \
          libglib2.0-dev \
          libwebkit2gtk-4.1-dev \
          libsoup-3.0-dev \
          libjavascriptcoregtk-4.1-dev \
          libgtk-3-dev \
          libayatana-appindicator3-dev \
          librsvg2-dev
    - name: Install frontend dependencies
      run: npm ci --prefix frontend
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose
    - name: Build frontend
      run: npm run build --prefix frontend

  linux-bundles:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
    - uses: dtolnay/rust-toolchain@stable
    - uses: actions/setup-node@v5
      with:
        node-version-file: frontend/package.json
        cache: npm
        cache-dependency-path: frontend/package-lock.json
    - name: Validate project context bootstrap
      run: ./scripts/load-project-context.sh --check
    - name: Install Linux system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          pkg-config \
          libglib2.0-dev \
          libwebkit2gtk-4.1-dev \
          libsoup-3.0-dev \
          libjavascriptcoregtk-4.1-dev \
          libgtk-3-dev \
          libayatana-appindicator3-dev \
          librsvg2-dev
    - name: Install frontend dependencies
      run: npm ci --prefix frontend
    - name: Install Tauri CLI
      run: cargo install tauri-cli --locked
    - name: Build Linux bundles
      run: cargo tauri build --bundles deb,rpm,appimage
    - name: Upload Linux artifacts
      uses: actions/upload-artifact@v4
      with:
        name: container-desktop-linux-bundles
        if-no-files-found: error
        path: |
          target/release/container-desktop-app
          target/release/bundle/deb/*.deb
          target/release/bundle/rpm/*.rpm
          target/release/bundle/appimage/*.AppImage
